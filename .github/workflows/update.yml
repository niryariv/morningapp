name: Update Morning edition

on:
  schedule:
    # GitHub cron is UTC: 05:15 in Israel Standard Time, 06:15 during daylight time.
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: morning-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assemble today's edition
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY || 'DEMO_KEY' }}
        run: python scripts/update.py

      - name: Verify publishable data
        run: |
          python -m json.tool data/today.json >/dev/null
          python -m json.tool docs/data/today.json >/dev/null
          python -m json.tool docs/data/archive.json >/dev/null
          cmp data/today.json docs/data/today.json

      - name: Commit generated editions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json data/history docs/data
          if git diff --cached --quiet; then
            echo "No edition changes to commit."
          else
            git commit -m "Update Morning edition"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

  deploy:
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
